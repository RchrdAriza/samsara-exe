# Renders the demo GIF shown in this repo's README, using the action from this checkout.
name: demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          fx: atkinson
          dot: 5
          timezone: America/Bogota
